<!DOCTYPE html>
<html lang="ca">
<head>

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meteo Sabadell Rambla</title>

<style>

*{
    box-sizing:border-box;
}

#icona_lluna .mdi{
    font-size:24px;
    color:#e1bee7;
    vertical-align:middle;
    margin-right:4px;
}

body{
    margin:0;
    padding:20px;
    background:#071625;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

.card{
    max-width:1000px;
    margin:auto;
    padding:30px;

    border-radius:24px;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.08),
    rgba(255,255,255,0)),
    linear-gradient(135deg,#10253d,#234b7d);

    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:10px;
}
.pluja-resum{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,.2);

    display:grid;
    grid-template-columns:repeat(6,1fr);

    text-align:center;
}

.pluja-resum b{
    font-size:28px;
}
.esquerra{
    text-align:left;
}

.dreta{
    text-align:right;
}

.centre{
    text-align:center;
    margin:20px 0;
}

#icona{
    width:220px;
    height:220px;
    display:block;
    margin:-10px auto 10px auto;
}
      
.subinfo{
    color:#b7c8da;
    font-size:18px;
}

.prediccio{
    margin-top:15px;
    line-height:1.8;
    font-size:20px;
}

#lluna_bloc{
    font-size:24px;
    font-weight:700;
}
      
.temp{
    font-size:90px;
    font-weight:700;
    line-height:1;
}
      
.condicio{
    font-size:28px;
    margin-top:10px;
}

.sensacio{
    margin-top:10px;
    opacity:.8;
}

.lluna{
    margin-top:15px;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}
      
.box{
    background:transparent;
    border:none;
    border-radius:0;
    padding:6px;
}

.label{
    color:#9bd4ff;
    font-size:13px;
    margin-bottom:6px;
}

.value{
    font-size:34px;
    font-weight:700;
}

.footer{
    margin-top:25px;
    text-align:right;
    opacity:.8;
    font-size:13px;
}
.pluja{
   color:#4fc3f7;
}

.tempesta{
   color:#ffb74d;
}

.neu{
   color:#e1f5fe;
}
      
.stats{
    display:grid;
    grid-template-columns:240px 240px;
    justify-content:center;
    gap:80px;
    position:relative;
}
#rati_bloc     { position:absolute; left:30px;  top:0; }
#humitat_bloc  { position:absolute; left:30px;  top:110px; }
#radiacio_bloc { position:absolute; left:80px;  top:220px; }

#ratxa_bloc    { position:absolute; right:30px; top:0; }
#vent_bloc     { position:absolute; right:30px; top:110px; }
#uv_bloc       { position:absolute; right:80px; top:220px; }
.stats::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    bottom:0;
    width:1px;
    background:rgba(255,255,255,.20);
}
.col{
    display:flex;
    flex-direction:column;
    gap:24px;
}
      
.col:last-child .metrica{
    padding-left:120px;
}
      
.metrica{
    font-size:18px;
    font-weight:700;
    color:#9bd4ff;
    width:240px;
}

.metrica span{
    display:block;
    color:white;
    font-size:28px;
    font-weight:700;
    margin-top:4px;
}

.metrica small{
    display:block;
    font-size:14px;
    color:#9bb7d4;
}

.sol{
    display:flex;
    justify-content:center;
    gap:80px;
    margin:25px 0;
    font-size:28px;
    font-weight:700;
}
.maxim{
    font-size:14px;
    color:#9bb7d4;
}  
.pressio-top{
    margin-top:8px;
    font-size:28px;
    font-weight:700;
    color:#ffd54f;
}
.pluja-m{ color:#4fc3f7; }
.humitat-m{ color:#7dd3fc; }
.radiacio-m{ color:#ffd54f; }

.ratxa-m{ color:#90caf9; }
.vent-m{ color:#b3e5fc; }
.uv-m{ color:#9ccc65; }      
@media (max-width:700px){

    .temp{
        font-size:70px;
    }

    .icona{
        font-size:60px;
    }

}

</style>

</head>

<body>

<div class="card">

      <div class="hero">
      
          <div class="esquerra">
      
              <div id="temp" class="temp">--</div>
                  <div class="sensacio">
                      Sensació:
                      <span id="sensacio">--</span>
                  </div>      
              <div id="condicio" class="condicio">
                  Carregant...
              </div>
      
              <div class="subinfo">
      
                  ☁️ <span id="cobertura">--</span>
                  ·
                  <span id="nuvols">--</span>
      
              </div>
      
          </div>
      
          <div class="dreta">
      
              <div id="lluna_bloc">
      
                  <span id="icona_lluna"></span>
      
                  <span id="lluna"></span>
      
                  (<span id="illuminaciolluna"></span>)
      
              </div>
      
              <div class="prediccio">
      
                  🌧 <span id="predpluja"></span>
      
                  ⚡ <span id="tempesta"></span>
      
                  ❄ <span id="neu"></span>
                  <hr>
                  
                  <div class="pressio-top">
                      → <span id="pressio"></span>
                  </div>      
              </div>
      
          </div>
      
      </div>
      
      <div class="centre">
      
          <img id="icona" alt="">
      
      </div>
      <div class="stats">
      
          <div class="col">
      
              <div class="metrica pluja-m">
                  🌧 Rati pluja
                  <span id="rati">--</span>
                  <small>màx. <span id="max_rati">--</span></small>
              </div>
      
              <div class="metrica humitat-m">
                  💧 Humitat
                  <span id="humitat">--</span>
                  <small>màx. <span id="max_humitat">--</span></small>
              </div>
      
              <div class="metrica radiacio-m">
                  ☀ Radiació
                  <span id="radiacio">--</span>
              </div>
      
          </div>
      
          <div class="col">
      
              <div class="metrica ratxa-m">
                  💨 Ratxa
                  <span id="ratxa">--</span>
                  <small>màx. <span id="max_ratxa">--</span></small>
              </div>
      
              <div class="metrica vent-m">
                  🌬 Vent
                  <span id="vent">--</span>
                  <small>màx. <span id="max_vent">--</span></small>
              </div>
      
              <div class="metrica uv-m">
                  UV
                  <span id="uv">--</span>
              </div>
      
          </div>
      
      </div>
      
      <div class="sol">
      
          <div>
              🌅 <span id="sortida_sol">--</span>
          </div>
      
          <div>
              🌇 <span id="posta_sol">--</span>
          </div>
      
      </div>

      <h2 style="
      text-align:center;
      color:#8fc7ff;
      margin-top:30px;">
      Pluja acumulada (l/m²)
      </h2>
      
      <div class="pluja-resum">
      
          <div>Hora<br><b id="pluja_hora"></b></div>
      
          <div>Avui<br><b id="pluja_avui"></b></div>
      
          <div>Ahir<br><b id="pluja_ahir"></b></div>
      
          <div>Setm.<br><b id="pluja_setmana"></b></div>
      
          <div>Mes<br><b id="pluja_mes"></b></div>
      
          <div>Any<br><b id="pluja_any"></b></div>
      
      </div>
    <div id="actualitzacio" class="footer"></div>

</div>

<script>

function carregarDades(){

    fetch("dades.json?t=" + Date.now())

    .then(r => r.json())

    .then(d => {

        document.getElementById("icona").src =
            "icons/" + d.icona;
        
        document.getElementById("condicio").textContent =
            d.condicio;

        document.getElementById("temp").textContent =
            d.actual.temperatura.toFixed(1) + "°";

        document.getElementById("sensacio").textContent =
            d.actual.sensacio.toFixed(1) + "°";

        document.getElementById("humitat").textContent =
            d.actual.humitat.toFixed(0) + "%";

        document.getElementById("pressio").textContent =
            d.actual.pressio.toFixed(1) + " hPa";

        document.getElementById("vent").textContent =
            d.actual.vent.toFixed(1) + " km/h";

        document.getElementById("ratxa").textContent =
            d.actual.ratxa.toFixed(1) + " km/h";

        document.getElementById("uv").textContent =
            d.actual.uv.toFixed(0);

        document.getElementById("radiacio").textContent =
            d.actual.radiacio.toFixed(0);

        document.getElementById("cobertura").textContent =
            d.actual.cobertura.toFixed(0) + "%";

        document.getElementById("nuvols").textContent =
            d.actual.base_nuvols.toFixed(0) + " m";

        document.getElementById("rati").textContent =
            d.pluja.rati.toFixed(1) + " mm/h";
            document.getElementById("max_rati").textContent =
                d.maxims.rati_pluja.toFixed(1) + " mm/h";
      document.getElementById("pluja_hora").textContent =
          d.pluja.hora.toFixed(1);
      
      document.getElementById("pluja_avui").textContent =
          d.pluja.avui.toFixed(1);
      
      document.getElementById("pluja_ahir").textContent =
          d.pluja.ahir.toFixed(1);
      
      document.getElementById("pluja_setmana").textContent =
          d.pluja.setmana.toFixed(1);
      
      document.getElementById("pluja_mes").textContent =
          d.pluja.mes.toFixed(1);
      
      document.getElementById("pluja_any").textContent =
          d.pluja.any.toFixed(1);            
            document.getElementById("max_vent").textContent =
                d.maxims.vent.toFixed(1) + " km/h";
            
            document.getElementById("max_ratxa").textContent =
                d.maxims.ratxa.toFixed(1) + " km/h";
            
            document.getElementById("max_humitat").textContent =
                d.maxims.humitat.toFixed(0) + "%";
                    
        document.getElementById("predpluja").textContent =
            d.prediccio.pluja + "%";

        document.getElementById("tempesta").textContent =
            d.prediccio.tempesta + "%";

        document.getElementById("neu").textContent =
            d.prediccio.neu + "%";

        document.getElementById("illuminaciolluna").textContent =
            d.astronomia.illuminacio_lluna.toFixed(0) +
            "% il·luminada";
                
        document.getElementById("lluna").textContent =
            d.astronomia.fase_lluna;
        
        const mdi = d.astronomia.icona_lluna;
        
        document.getElementById("icona_lluna").innerHTML =
            `<i class="mdi ${mdi.replace('mdi:', 'mdi-')}"></i>`;
        document.getElementById("sortida_sol").textContent =
            new Date(
                d.astronomia.sortida_sol
            ).toLocaleTimeString(
                "ca-ES",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );
      
        document.getElementById("posta_sol").textContent =
            new Date(
                d.astronomia.posta_sol
            ).toLocaleTimeString(
                "ca-ES",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );
              
        document.getElementById("actualitzacio").textContent =
            "Actualitzat: " +
            new Date(d.actualitzacio).toLocaleString("ca-ES");

    })

       .catch(err => {
          console.error(err);
          alert(err);
      });

}

carregarDades();

/* refresc cada 5 segons */

setInterval(carregarDades, 5000);

</script>

</body>
</html>
