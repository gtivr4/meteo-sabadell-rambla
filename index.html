<!DOCTYPE html>
<html lang="ca">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meteo Sabadell Rambla</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#071625;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

.card{
    max-width:1200px;
    margin:auto;

    background:
      radial-gradient(circle at top,
      rgba(255,255,255,.08),
      rgba(255,255,255,0)),
      linear-gradient(135deg,#10253d,#234b7d);

    border-radius:24px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.temp{
    font-size:100px;
    font-weight:700;
    line-height:1;
}

.sub{
    font-size:24px;
    opacity:.9;
}

.lluna{
    text-align:right;
    font-size:20px;
    line-height:1.7;
}

.grid{
    margin-top:30px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.box{
    background:rgba(255,255,255,.08);
    border-radius:16px;
    padding:15px;
}

.label{
    color:#9bd4ff;
    font-size:13px;
    margin-bottom:6px;
}

.value{
    font-size:28px;
    font-weight:bold;
}

.footer{
    margin-top:25px;
    text-align:right;
    opacity:.7;
    font-size:13px;
}

@media (max-width:700px){

    .temp{
        font-size:70px;
    }

    .lluna{
        text-align:left;
    }

}

</style>
</head>

<body>

<div class="card">

    <div class="header">

        <div>

            <div class="temp" id="temp">
                --
            </div>

            <div class="sub">
                Sensació:
                <span id="sensacio">--</span>
            </div>

        </div>

        <div class="lluna">

            <div id="lluna">
                🌙 --
            </div>

            <div id="llumlluna">
                --
            </div>

        </div>

    </div>

    <div class="grid">

        <div class="box">
            <div class="label">Humitat</div>
            <div class="value" id="humitat">--</div>
        </div>

        <div class="box">
            <div class="label">Pressió</div>
            <div class="value" id="pressio">--</div>
        </div>

        <div class="box">
            <div class="label">Vent</div>
            <div class="value" id="vent">--</div>
        </div>

        <div class="box">
            <div class="label">Ratxa</div>
            <div class="value" id="ratxa">--</div>
        </div>

        <div class="box">
            <div class="label">Radiació</div>
            <div class="value" id="radiacio">--</div>
        </div>

        <div class="box">
            <div class="label">UV</div>
            <div class="value" id="uv">--</div>
        </div>

        <div class="box">
            <div class="label">Cobertura núvols</div>
            <div class="value" id="cobertura">--</div>
        </div>

        <div class="box">
            <div class="label">Base núvols</div>
            <div class="value" id="nuvols">--</div>
        </div>

        <div class="box">
            <div class="label">Pluja hora</div>
            <div class="value" id="pluja_hora">--</div>
        </div>

        <div class="box">
            <div class="label">Pluja avui</div>
            <div class="value" id="pluja_avui">--</div>
        </div>

        <div class="box">
            <div class="label">Pluja setmana</div>
            <div class="value" id="pluja_setmana">--</div>
        </div>

        <div class="box">
            <div class="label">Pluja any</div>
            <div class="value" id="pluja_any">--</div>
        </div>

        <div class="box">
            <div class="label">Prob. pluja</div>
            <div class="value" id="pred_pluja">--</div>
        </div>

        <div class="box">
            <div class="label">Tempesta</div>
            <div class="value" id="pred_tempesta">--</div>
        </div>

        <div class="box">
            <div class="label">Neu</div>
            <div class="value" id="pred_neu">--</div>
        </div>

    </div>

    <div class="footer" id="actualitzacio">
        --
    </div>

</div>

<script>

function formatData(dataISO){

    const data = new Date(dataISO);

    return data.toLocaleString(
        "ca-ES",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );
}

function carregarDades(){

    fetch("dades.json?t=" + Date.now())

    .then(r => r.json())

    .then(d => {

        document.getElementById("temp").textContent =
            d.actual.temperatura.toFixed(1) + "°";

        document.getElementById("sensacio").textContent =
            d.actual.sensacio.toFixed(1) + "°";

        document.getElementById("humitat").textContent =
            d.actual.humitat.toFixed(0) + "%";

        document.getElementById("pressio").textContent =
            d.actual.pressio.toFixed(1) + " hPa";

        document.getElementById("vent").textContent =
            d.actual.vent.toFixed(1) + " km/h";

        document.getElementById("ratxa").textContent =
            d.actual.ratxa.toFixed(1) + " km/h";

        document.getElementById("radiacio").textContent =
            d.actual.radiacio.toFixed(0) + " W/m²";

        document.getElementById("uv").textContent =
            d.actual.uv.toFixed(0);

        document.getElementById("cobertura").textContent =
            d.actual.cobertura.toFixed(0) + "%";

        document.getElementById("nuvols").textContent =
            d.actual.base_nuvols.toFixed(0) + " m";

        document.getElementById("pluja_hora").textContent =
            d.pluja.hora.toFixed(1) + " mm";

        document.getElementById("pluja_avui").textContent =
            d.pluja.avui.toFixed(1) + " mm";

        document.getElementById("pluja_setmana").textContent =
            d.pluja.setmana.toFixed(1) + " mm";

        document.getElementById("pluja_any").textContent =
            d.pluja.any.toFixed(1) + " mm";

        document.getElementById("pred_pluja").textContent =
            d.prediccio.pluja + "%";

        document.getElementById("pred_tempesta").textContent =
            d.prediccio.tempesta + "%";

        document.getElementById("pred_neu").textContent =
            d.prediccio.neu + "%";

        document.getElementById("lluna").textContent =
            "🌙 " + d.astronomia.fase_lluna;

        document.getElementById("llumlluna").textContent =
            "Il·luminació: " +
            d.astronomia.llum_lluna.toFixed(0) + "%";

        document.getElementById("actualitzacio").textContent =
            "Actualitzat: " +
            formatData(d.actualitzacio);

    })

    .catch(err => {

        console.error(err);

    });

}

carregarDades();

/* cada 5 segons */

setInterval(
    carregarDades,
    5000
);

</script>

</body>
</html>
