<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meteo Sabadell Rambla</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#071625;
    color:white;
    font-family:Segoe UI,Arial,sans-serif;
}

.card{
    max-width:1200px;
    margin:auto;
    padding:30px;

    border-radius:24px;

    background:
    radial-gradient(circle at top,
    rgba(255,255,255,.08),
    rgba(255,255,255,0)),
    linear-gradient(135deg,#10253d,#234b7d);

    box-shadow:0 10px 30px rgba(0,0,0,.35);
}

.hero{
    text-align:center;
    margin-bottom:30px;
}

.icona{
    font-size:90px;
}

.temp{
    font-size:110px;
    font-weight:700;
    line-height:1;
}

.condicio{
    font-size:28px;
    margin-top:10px;
}

.sensacio{
    margin-top:10px;
    opacity:.8;
}

.lluna{
    margin-top:15px;
    font-size:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.box{
    background:rgba(255,255,255,.08);
    border-radius:16px;
    padding:15px;
}

.label{
    color:#9bd4ff;
    font-size:13px;
    margin-bottom:6px;
}

.value{
    font-size:28px;
    font-weight:bold;
}

.footer{
    margin-top:25px;
    text-align:right;
    opacity:.8;
    font-size:13px;
}

@media (max-width:700px){

    .temp{
        font-size:70px;
    }

    .icona{
        font-size:60px;
    }

}

</style>

</head>

<body>

<div class="card">

    <div class="hero">

        <div id="icona" class="icona">☁️</div>

        <div id="temp" class="temp">--</div>

        <div id="condicio" class="condicio">
            Carregant...
        </div>

        <div class="sensacio">
            Sensació:
            <span id="sensacio">--</span>
        </div>

        <div class="lluna">
            <span id="lluna">🌙 --</span>
            ·
            <span id="llumlluna">--</span>
        </div>

    </div>

    <div class="grid">

        <div class="box">
            <div class="label">Humitat</div>
            <div id="humitat" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Pressió</div>
            <div id="pressio" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Vent</div>
            <div id="vent" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Ratxa</div>
            <div id="ratxa" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">UV</div>
            <div id="uv" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Radiació</div>
            <div id="radiacio" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Cobertura</div>
            <div id="cobertura" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Base núvols</div>
            <div id="nuvols" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Pluja avui</div>
            <div id="pluja" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Prob. pluja</div>
            <div id="predpluja" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Tempesta</div>
            <div id="tempesta" class="value">--</div>
        </div>

        <div class="box">
            <div class="label">Neu</div>
            <div id="neu" class="value">--</div>
        </div>

    </div>

    <div id="actualitzacio" class="footer"></div>

</div>

<script>

function tradueixLluna(fase){

    const fases = {
        "new_moon":"Lluna nova",
        "waxing_crescent":"Creixent",
        "first_quarter":"Quart creixent",
        "waxing_gibbous":"Gibosa creixent",
        "full_moon":"Lluna plena",
        "waning_gibbous":"Gibosa minvant",
        "last_quarter":"Quart minvant",
        "waning_crescent":"Minvant"
    };

    return fases[fase] || fase;
}

function obtenirCondicio(d){

    if(d.pluja.hora > 0){
        return { icona:"🌧️", text:"Plovent" };
    }

    if(d.actual.cobertura > 90){
        return { icona:"☁️", text:"Molt ennuvolat" };
    }

    if(d.actual.cobertura > 60){
        return { icona:"⛅", text:"Parcialment ennuvolat" };
    }

    if(d.actual.cobertura > 20){
        return { icona:"🌤️", text:"Poc ennuvolat" };
    }

    return { icona:"☀️", text:"Assolellat" };
}
function getWeatherIcon(dades) {

  const cobertura = parseInt(dades.actual.cobertura || 0);
  const pluja = parseFloat(dades.pluja.hora || 0);
  const vent = parseFloat(dades.actual.vent || 0);
  const ratxa = parseFloat(dades.actual.ratxa || 0);
  const humitat = parseFloat(dades.actual.humitat || 0);
  const uv = parseFloat(dades.actual.uv || 0);
  const temp = parseFloat(dades.actual.temperatura || 0);
  const cloudBase = parseFloat(dades.actual.base_nuvols || 9999);

  const tempesta = parseInt(dades.probabilitat_tempesta || 0);
  const neu = parseInt(dades.probabilitat_neu || 0);

  const hora = new Date();
  const nit = hora.getHours() < 7 || hora.getHours() >= 21;

  /* =====================
       TEMPESTA
    ===================== */
    
    if (tempesta >= 80 && pluja >= 5)
      return 'thunderstorms-overcast-rain.svg';
    
    if (tempesta >= 80)
      return 'thunderstorms-overcast.svg';
    
    if (tempesta >= 60 && pluja > 0)
      return 'thunderstorms-rain.svg';
    
    if (tempesta >= 60)
      return 'thunderstorms.svg';
    
    
    
    /* =====================
       NEU
    ===================== */
    
    if (neu >= 80)
      return 'overcast-snow.svg';
    
    if (neu >= 50)
      return 'snow.svg';
    
    
    
    /* =====================
       AIGUANEU
    ===================== */
    
    if (
      neu >= 30 &&
      pluja > 0
    ) {
      return 'sleet.svg';
    }
    
    
    
    /* =====================
       CALAMARSA
    ===================== */
    
    if (
      temp <= 3 &&
      tempesta >= 60 &&
      pluja >= 5
    ) {
      return 'hail.svg';
    }
    
    
    
    /* =====================
       PLUJA TORRENCIAL
    ===================== */
    
    if (pluja >= 30) {
    
      if (nit)
        return 'extreme-night-rain.svg';
    
      return 'extreme-day-rain.svg';
    }
    
    
    
    /* =====================
       PLUJA FORTA
    ===================== */
    
    if (pluja >= 10) {
    
      if (nit)
        return 'overcast-night-rain.svg';
    
      return 'overcast-day-rain.svg';
    }
    
    
    
    /* =====================
       PLUJA MODERADA
    ===================== */
    
    if (pluja >= 2) {
    
      if (nit)
        return 'overcast-night-rain.svg';
    
      return 'overcast-day-rain.svg';
    }
    
    
    
    /* =====================
       PLUGIM
    ===================== */
    
    if (pluja > 0) {
    
      if (nit)
        return 'overcast-night-drizzle.svg';
    
      return 'overcast-day-drizzle.svg';
    }
    
    
    
    /* =====================
       BOIRA DENSA
    ===================== */
    
    if (
      humitat >= 97 &&
      vent < 3 &&
      cloudBase < 300
    ) {
    
      if (nit)
        return 'fog-night.svg';
    
      return 'fog-day.svg';
    }
    
    
    
    /* =====================
       BOIRA
    ===================== */
    
    if (
      humitat >= 95 &&
      vent < 5
    ) {
      return 'fog.svg';
    }
    
    
    
    /* =====================
       BOIRINA
    ===================== */
    
    if (
      humitat >= 90 &&
      cobertura >= 60
    ) {
    
      if (nit)
        return 'haze-night.svg';
    
      return 'haze-day.svg';
    }
    
    
    
    /* =====================
       HAZE
    ===================== */
    
    if (
      humitat >= 80 &&
      cobertura >= 70
    ) {
      return 'haze.svg';
    }
    
    
    
    /* =====================
       VENT MOLT FORT
    ===================== */
    
    if (ratxa >= 70)
      return 'cloud-up.svg';
    
    
    
    /* =====================
       VENT FORT
    ===================== */
    
    if (ratxa >= 50)
      return 'cloud-down.svg';
    
    
    
    /* =====================
       SOL MOLT FORT
    ===================== */
    
    if (
      uv >= 8 &&
      cobertura <= 5
    ) {
      return 'sun-hot.svg';
    }
    
    
    
    /* =====================
       CEL DESPEJAT
    ===================== */
    
    if (!nit) {
    
      if (cobertura <= 5)
        return 'clear-day.svg';
    
      if (cobertura <= 25)
        return 'mostly-clear-day.svg';
    
      if (cobertura <= 55)
        return 'partly-cloudy-day.svg';
    
      if (cobertura <= 85)
        return 'overcast-day.svg';
    
      return 'cloudy.svg';
    }
    
    
    
    /* =====================
       CEL NOCTURN
    ===================== */
    
    if (nit) {
    
      if (cobertura <= 5)
        return 'clear-night.svg';
    
      if (cobertura <= 25)
        return 'mostly-clear-night.svg';
    
      if (cobertura <= 55)
        return 'partly-cloudy-night.svg';
    
      if (cobertura <= 85)
        return 'overcast-night.svg';
    
      return 'cloudy.svg';
    }
    
    
    
    return 'cloudy.svg';
}
function carregarDades(){

    fetch("dades.json?t=" + Date.now())

    .then(r => r.json())

    .then(d => {

        const c = obtenirCondicio(d);

        document.getElementById("icona").textContent =
            c.icona;

        document.getElementById("condicio").textContent =
            c.text;

        document.getElementById("temp").textContent =
            d.actual.temperatura.toFixed(1) + "°";

        document.getElementById("sensacio").textContent =
            d.actual.sensacio.toFixed(1) + "°";

        document.getElementById("humitat").textContent =
            d.actual.humitat.toFixed(0) + "%";

        document.getElementById("pressio").textContent =
            d.actual.pressio.toFixed(1) + " hPa";

        document.getElementById("vent").textContent =
            d.actual.vent.toFixed(1) + " km/h";

        document.getElementById("ratxa").textContent =
            d.actual.ratxa.toFixed(1) + " km/h";

        document.getElementById("uv").textContent =
            d.actual.uv.toFixed(0);

        document.getElementById("radiacio").textContent =
            d.actual.radiacio.toFixed(0) + " W/m²";

        document.getElementById("cobertura").textContent =
            d.actual.cobertura.toFixed(0) + "%";

        document.getElementById("nuvols").textContent =
            d.actual.base_nuvols.toFixed(0) + " m";

        document.getElementById("pluja").textContent =
            d.pluja.avui.toFixed(1) + " mm";

        document.getElementById("predpluja").textContent =
            d.prediccio.pluja + "%";

        document.getElementById("tempesta").textContent =
            d.prediccio.tempesta + "%";

        document.getElementById("neu").textContent =
            d.prediccio.neu + "%";

        document.getElementById("lluna").textContent =
            "🌙 " + tradueixLluna(d.astronomia.fase_lluna);

        document.getElementById("llumlluna").textContent =
            d.astronomia.llum_lluna.toFixed(0) +
            "% il·luminada";

        document.getElementById("actualitzacio").textContent =
            "Actualitzat: " +
            new Date(d.actualitzacio).toLocaleString("ca-ES");

    })

    .catch(err => console.error(err));

}

carregarDades();

/* refresc cada 5 segons */

setInterval(carregarDades, 5000);

</script>

</body>
</html>
