<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Meteo Sabadell Rambla</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#091a2b;
  font-family:Segoe UI,Arial,sans-serif;
  color:white;
}

.card{
  max-width:1000px;
  margin:auto;
  background:
    radial-gradient(
      circle at center,
      rgba(255,255,255,.05) 0%,
      rgba(255,255,255,0) 95%
    ),
    linear-gradient(
      135deg,
      #0b1f35,
      #1f4068
    );

  border-radius:24px;
  padding:30px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  flex-wrap:wrap;
}

.temp{
  font-size:90px;
  font-weight:700;
  line-height:1;
}

.condicio{
  font-size:22px;
  opacity:.9;
  margin-top:6px;
}

.lluna{
  font-size:22px;
  text-align:right;
}

.grid{
  margin-top:30px;

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.bloc{
  background:rgba(255,255,255,.08);
  border-radius:16px;
  padding:15px;
}

.label{
  color:#90caf9;
  font-size:13px;
  margin-bottom:8px;
}

.valor{
  font-size:28px;
  font-weight:700;
}

.footer{
  margin-top:30px;
  font-size:13px;
  opacity:.75;
  text-align:right;
}

@media (max-width:700px){

  .temp{
    font-size:70px;
  }

  .lluna{
    width:100%;
    text-align:left;
  }

}

</style>
</head>

<body>

<div class="card">

  <div class="top">

    <div>

      <div
        class="temp"
        id="temp">
        --
      </div>

      <div
        class="condicio"
        id="condicio">
        Estació meteorològica
      </div>

    </div>

    <div
      class="lluna"
      id="lluna">
      🌙 --
    </div>

  </div>

  <div class="grid">

    <div class="bloc">
      <div class="label">Humitat</div>
      <div class="valor" id="humitat">--</div>
    </div>

    <div class="bloc">
      <div class="label">Pressió</div>
      <div class="valor" id="pressio">--</div>
    </div>

    <div class="bloc">
      <div class="label">Vent</div>
      <div class="valor" id="vent">--</div>
    </div>

    <div class="bloc">
      <div class="label">Ratxa</div>
      <div class="valor" id="ratxa">--</div>
    </div>

    <div class="bloc">
      <div class="label">Pluja avui</div>
      <div class="valor" id="pluja">--</div>
    </div>

    <div class="bloc">
      <div class="label">UV</div>
      <div class="valor" id="uv">--</div>
    </div>

    <div class="bloc">
      <div class="label">Cobertura</div>
      <div class="valor" id="cobertura">--</div>
    </div>

    <div class="bloc">
      <div class="label">Base núvols</div>
      <div class="valor" id="nuvols">--</div>
    </div>

  </div>

  <div
    class="footer"
    id="actualitzacio">
  </div>

</div>

<script>

function formatData(iso){

  const d = new Date(iso);

  return d.toLocaleString(
    "ca-ES",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}

function carregarDades(){

  fetch(
    "dades.json?t=" + Date.now()
  )

  .then(r => r.json())

  .then(d => {

    document.getElementById("temp").textContent =
      d.actual.temperatura.toFixed(1) + "°";

    document.getElementById("humitat").textContent =
      d.actual.humitat.toFixed(0) + "%";

    document.getElementById("pressio").textContent =
      d.actual.pressio.toFixed(1) + " hPa";

    document.getElementById("vent").textContent =
      d.actual.vent.toFixed(1) + " km/h";

    document.getElementById("ratxa").textContent =
      d.actual.ratxa.toFixed(1) + " km/h";

    document.getElementById("pluja").textContent =
      d.pluja.avui.toFixed(1) + " l/m²";

    document.getElementById("uv").textContent =
      d.actual.uv.toFixed(0);

    document.getElementById("cobertura").textContent =
      d.actual.cobertura.toFixed(0) + "%";

    document.getElementById("nuvols").textContent =
      d.actual.base_nuvols.toFixed(0) + " m";

    document.getElementById("lluna").textContent =
      "🌙 " + d.astronomia.fase_lluna;

    document.getElementById("actualitzacio").textContent =
      "Actualitzat: " +
      formatData(d.actualitzacio);

  })

  .catch(error => {

    console.error(error);

  });

}

carregarDades();

/* actualització automàtica cada 5 minuts */

setInterval(
  carregarDades,
  5000
);

</script>

</body>
</html>
