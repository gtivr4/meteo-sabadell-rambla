<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteo Sabadell Rambla</title>

<style>

body{
    margin:0;
    padding:20px;
    background:#091a2b;
    font-family:Segoe UI,Arial,sans-serif;
    color:white;
}

.card{
    max-width:900px;
    margin:auto;

    background:
      radial-gradient(circle at center,
      rgba(255,255,255,.05) 0%,
      rgba(255,255,255,0) 95%),
      linear-gradient(135deg,#0b1f35,#1f4068);

    border-radius:24px;
    padding:30px;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    flex-wrap:wrap;
}

.temp{
    font-size:90px;
    font-weight:700;
    line-height:1;
}

.condicio{
    font-size:22px;
    opacity:.9;
}

.grid{
    margin-top:30px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
}

.bloc{
    background:rgba(255,255,255,.08);
    border-radius:16px;
    padding:15px;
}

.label{
    color:#90caf9;
    font-size:13px;
}

.valor{
    font-size:28px;
    font-weight:700;
}

.footer{
    margin-top:25px;
    font-size:13px;
    opacity:.7;
    text-align:right;
}

</style>
</head>

<body>

<div class="card">

    <div class="top">

        <div>
            <div class="temp" id="temp">--</div>
            <div class="condicio" id="condicio">
                Estació meteorològica
            </div>
        </div>

        <div id="lluna"></div>

    </div>

    <div class="grid">

        <div class="bloc">
            <div class="label">Humitat</div>
            <div class="valor" id="humitat">--</div>
        </div>

        <div class="bloc">
            <div class="label">Pressió</div>
            <div class="valor" id="pressio">--</div>
        </div>

        <div class="bloc">
            <div class="label">Vent</div>
            <div class="valor" id="vent">--</div>
        </div>

        <div class="bloc">
            <div class="label">Ratxa</div>
            <div class="valor" id="ratxa">--</div>
        </div>

        <div class="bloc">
            <div class="label">Pluja avui</div>
            <div class="valor" id="pluja">--</div>
        </div>

        <div class="bloc">
            <div class="label">UV</div>
            <div class="valor" id="uv">--</div>
        </div>

    </div>

    <div class="footer" id="actualitzacio"></div>

</div>

<script>

fetch("dades.json?t=" + Date.now())
.then(r => r.json())
.then(d => {

    console.log(d);

    document.getElementById("temp").innerHTML =
        d.actual.temperatura + "°";

    document.getElementById("humitat").innerHTML =
        d.actual.humitat + "%";

    document.getElementById("pressio").innerHTML =
        d.actual.pressio + " hPa";

    document.getElementById("vent").innerHTML =
        d.actual.vent + " km/h";

    document.getElementById("ratxa").innerHTML =
        d.actual.ratxa + " km/h";

    document.getElementById("pluja").innerHTML =
        d.pluja.avui + " l/m²";

    document.getElementById("uv").innerHTML =
        d.actual.uv;

    document.getElementById("lluna").innerHTML =
        "🌙 " + d.astronomia.fase_lluna;

    document.getElementById("actualitzacio").innerHTML =
        d.actualitzacio;

})
.catch(error => {

    document.body.innerHTML +=
        "<pre>" + error + "</pre>";

    console.error(error);

});

</script>
